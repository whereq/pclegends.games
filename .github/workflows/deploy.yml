name: Deploy PC Legends to GitHub Pages

# The site is published with GitHub Actions rather than the legacy
# branch-build: a legacy Pages build is killed after ten minutes, and a
# build of 1 898 game routes sits right on that edge. Actions has no such
# limit, and it does not need a second clone of the site into a Pages repo.
#
# The custom domain travels in `static/CNAME`, which Docusaurus copies into
# the build. A domain set in the Pages UI would be wiped by the next
# deploy; a CNAME in the source repo cannot.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and the newest one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # The build fails the job if it fails — no `| tail` in the way.
          CI: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
